# mpulse devcontainer - Docker Compose
# Projects: DPI_Analytics_DBT, hxi-infra, data-pipelines/snowflake-export
#
# Volume strategy: Named bind mounts to ~/.claudio/ on host.
# Shares claudio-shared with base Claudio container.

services:
  devcontainer:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        CLAUDIO_TAG: ${CLAUDIO_TAG:-develop}
        CLAUDIO_IMAGE: ${CLAUDIO_IMAGE:-ghcr.io/ksizzle88/claudio}
    image: mpulse-claudio:${CLAUDIO_TAG:-develop}
    hostname: mpulse
    cap_add:
      - NET_ADMIN
      - NET_RAW

    volumes:
      # mpulse root as workspace
      - ..:/workspace:cached
      # Docker socket (docker-outside-of-docker)
      - /var/run/docker.sock:/var/run/docker.sock
      # Config files from host (Windows configs via WSL)
      - ${CONFIG_HOME:-$HOME}/.aws:/home/dev/.aws
      - ${CONFIG_HOME:-$HOME}/.snowflake:/home/dev/.snowflake-host:ro
      - ${CONFIG_HOME:-$HOME}/.ssh:/home/dev/.ssh-host:ro
      # Persisted snowflake config (seeded from host on first run)
      - mpulse-snowflake:/home/dev/.snowflake
      # Claudio v3: shared auth/config/plugins + per-container sessions
      - claudio-shared:/home/dev/.claudio-shared
      - mpulse-sessions:/home/dev/.claudio-sessions
      # Hashicorp suite env and creds (Vault, Nomad, Consul)
      - ${CONFIG_HOME:-$HOME}/.envs:/home/dev/.envs:ro
      # Azure credentials (persisted, seeded by entrypoint if needed)
      - mpulse-azure:/home/dev/.azure
      # Persist container settings and configs
      - mpulse-config:/home/dev/.config
      - mpulse-local:/home/dev/.local
      - mpulse-cache:/home/dev/.cache

    environment:
      # Claudio v3 paths
      CLAUDIO_SHARED: /home/dev/.claudio-shared
      CLAUDIO_SESSIONS: /home/dev/.claudio-sessions
      CLAUDE_CONFIG_DIR: /home/dev/.claude
      # SSH (keys mounted directly, no agent forwarding)
      SSH_AUTH_SOCK: ${SSH_AUTH_SOCK:-}
      # Shell
      SHELL: /bin/zsh
      EDITOR: nano
      # Locale / timezone
      TZ: ${TZ:-America/New_York}
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      # dbt profile location
      DBT_PROFILES_DIR: /workspace/DPI_Analytics_DBT/dbt-profiles
      # Snowflake SSO callback (fixed port for container browser auth)
      SF_AUTH_SOCKET_PORT: "3037"
      SNOWFLAKE_AUTH_SOCKET_REUSE_PORT: "true"
      SNOWFLAKE_AUTH_SOCKET_MSG_DONTWAIT: "true"
      # Snowflake (values come from .env)
      SNOWFLAKE_ACCOUNT: ${SNOWFLAKE_ACCOUNT:-}
      SNOWFLAKE_USER: ${SNOWFLAKE_USER:-}
      SNOWFLAKE_PASSWORD: ${SNOWFLAKE_PASSWORD:-}
      SNOWFLAKE_WAREHOUSE: ${SNOWFLAKE_WAREHOUSE:-}
      SNOWFLAKE_DATABASE: ${SNOWFLAKE_DATABASE:-}
      SNOWFLAKE_SCHEMA: ${SNOWFLAKE_SCHEMA:-}
      SNOWFLAKE_ROLE: ${SNOWFLAKE_ROLE:-}
      # AWS

    env_file:
      - path: .env
        required: false

    ports:
      - "3037:3037"

    healthcheck:
      test: ["CMD", "sh", "-c", "command -v claude && command -v dbt"]
      interval: 2m
      timeout: 5s
      retries: 3
      start_period: 15s

    deploy:
      resources:
        limits:
          ### high limits as this is where I do most of my work. 
          cpus: '12.0'
          memory: 16G
        reservations:
          cpus: '2.0'
          memory: 4G

    extra_hosts:
      - "host.docker.internal:host-gateway"

    labels:
      com.claudio.description: "mpulse data engineering devcontainer"
      com.claudio.project: "mpulse"
      com.claudio.version: "3.0.0"

    networks:
      - dev-network

    restart: unless-stopped

volumes:
  # Named bind mount — shared across all Claudio containers
  claudio-shared:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${CLAUDIO_ROOT:-/home/kschepis/.claudio}/shared

  # Named bind mount — persistent mpulse sessions
  mpulse-sessions:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${CLAUDIO_ROOT:-/home/kschepis/.claudio}/sessions/mpulse

  # Existing mpulse tool volumes
  mpulse-config:
  mpulse-local:
  mpulse-cache:
  mpulse-azure:
  mpulse-snowflake:
    external: true
    name: mpulse-snowflake

networks:
  dev-network:
    driver: bridge
