version: '3.8'

services:
  devcontainer:
    build:
      context: .
      dockerfile: .devcontainer/Dockerfile
      args:
        NODE_VERSION: 20
    # NOTE: Avoid `container_name:` so multiple Compose projects can run side-by-side
    # (use `docker compose -p <name>` or `COMPOSE_PROJECT_NAME=<name>`).
    image: ${COMPOSE_PROJECT_NAME:-claudio}-devcontainer:latest
    hostname: claudio

    volumes:
    # Bind mount the workspace (cached for better performance on macOS/Windows)
    - .:/workspace:cached
    # Named volume for shell history
    - shell-history:/home/vscode/.history

    environment:
    - TZ=${TZ:-UTC}
    - LANG=C.UTF-8
    - LC_ALL=C.UTF-8
    # Claude config handled via devcontainer.json mounts with ${devcontainerId}

    # Keep container running
    command: sleep infinity

    # Healthcheck to ensure container is functional
    healthcheck:
      test: [ "CMD", "node", "--version" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

    # Resource limits (adjust based on your needs)
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
        reservations:
          cpus: '1.0'
          memory: 2G

    # Labels for metadata and organization
    labels:
      com.claudio.description: "Claude Code development container"
      com.claudio.service: "devcontainer"
      com.claudio.version: "1.0.0"
      com.claudio.project: "claudio"

    # Network for shared services
    networks:
    - dev-network

    # Restart policy
    restart: unless-stopped
  # Example shared services (commented out - uncomment as needed)

  # postgres:
  #   image: postgres:16-alpine
  #   environment:
  #     POSTGRES_USER: dev
  #     POSTGRES_PASSWORD: dev
  #     POSTGRES_DB: dev_db
  #   volumes:
  #     - postgres-data:/var/lib/postgresql/data
  #   networks:
  #     - dev-network
  #   ports:
  #     - "5432:5432"

  # redis:
  #   image: redis:7-alpine
  #   volumes:
  #     - redis-data:/data
  #   networks:
  #     - dev-network
  #   ports:
  #     - "6379:6379"

volumes:
  # Persistent volume for shell history
  shell-history:
    # Note: Claude settings now use per-container volumes via devcontainer.json mounts
    # (claudio-claude-config-${devcontainerId})
    # Uncomment if using postgres
    # postgres-data:
    # Uncomment if using redis
    # redis-data:

networks:
  dev-network:
    driver: bridge
