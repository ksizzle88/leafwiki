# Claudio v3 - Docker Compose Configuration
#
# Volume strategy: Named bind mounts to ~/.claudio/ on host.
# - claudio-shared: auth, config, plugins, caches (cross-container)
# - claudio-sessions: projects, teams, tasks (per-container, persistent)
#
# Services:
# - claudio-standalone: Full standalone service (CI/CD, testing, non-VS Code use)
# - devcontainer: VS Code attaches here (extends standalone)
# - leafwiki: Browser-based markdown knowledge base
# - devcontainer-test: Side-by-side testing service

services:
  # Base service - standalone capable, all runtime config here
  claudio-standalone:
    build:
      context: .
      dockerfile: Dockerfile.base
      args:
        DEV_USER: ${DEV_USER:-dev}
        DEV_UID: ${DEV_UID:-1000}
        DEV_GID: ${DEV_GID:-1000}
        DEV_PASSWORD: ${DEV_PASSWORD:-dev}
        NODE_VERSION: 22
        ZSH_IN_DOCKER_VERSION: 1.2.0
        GIT_USER_EMAIL: ${GIT_USER_EMAIL:-}
        GIT_USER_NAME: ${GIT_USER_NAME:-}
        GIT_GPG_SIGN: ${GIT_GPG_SIGN:-false}
        GIT_SIGNING_KEY: ${GIT_SIGNING_KEY:-}
        BUILD_COMMIT: ${BUILD_COMMIT:-unknown}
        BUILD_DATE: ${BUILD_DATE:-unknown}
        BUILD_BRANCH: ${BUILD_BRANCH:-unknown}
        BUILD_TAG: ${BUILD_TAG:-dev}
        BUILD_HOSTNAME: ${BUILD_HOSTNAME:-unknown}
    image: ${COMPOSE_PROJECT_NAME:-claudio}-base:${TAG:-develop}
    hostname: claudio
    cap_add:
      - NET_ADMIN
      - NET_RAW

    volumes:
      - .:/workspace:cached
      - claudio-shared:/home/dev/.claudio-shared
      # Standalone gets ephemeral sessions (overridden by devcontainer.json)
      - claudio-standalone-sessions:/home/dev/.claudio-sessions

    environment:
      CLAUDE_CONFIG_DIR: /home/dev/.claude
      CLAUDIO_SHARED: /home/dev/.claudio-shared
      CLAUDIO_SESSIONS: /home/dev/.claudio-sessions
      SHELL: /bin/zsh
      EDITOR: nano
      TZ: ${TZ:-UTC}
      LANG: C.UTF-8
      LC_ALL: C.UTF-8

    healthcheck:
      test: ["CMD", "sh", "-c", "command -v claude >/dev/null && command -v codex >/dev/null"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

    deploy:
      resources:
        limits:
          cpus: '8.0'
          memory: 8G
        reservations:
          cpus: '1.0'
          memory: 2G

    labels:
      com.claudio.description: "Claude Code development container"
      com.claudio.service: "standalone"
      com.claudio.version: "3.0.0"
      com.claudio.project: "claudio"

    networks:
      - dev-network
    restart: unless-stopped

  # VS Code devcontainer — extends standalone
  # devcontainer.json overrides sessions volume with persistent bind mount
  devcontainer:
    extends:
      service: claudio-standalone
    ports:
      - "5565:5565"
    volumes:
      - /home/kschepis/workspaces/mpulse:/workspace/mpulse:cached
      - /home/kschepis/dev-container-backups:/workspace/backups:ro
    depends_on:
      leafwiki:
        condition: service_healthy
    labels:
      com.claudio.service: "devcontainer"

  # LeafWiki — lightweight markdown wiki
  # http://localhost:3000 (host)
  leafwiki:
    image: ghcr.io/perber/leafwiki:latest
    ports:
      - "3000:8080"
    volumes:
      - ./.sandbox:/app/data/sandbox:cached
      - /home/kschepis/workspaces/mpulse/hxi-infra:/app/data/hxi-infra:cached
      - claudio-shared:/app/data/claudio-shared:ro
    command: --disable-auth --allow-insecure
    restart: unless-stopped
    networks:
      - dev-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    labels:
      com.claudio.service: "leafwiki"
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  # Test service for developing the devcontainer itself
  devcontainer-test:
    extends:
      service: claudio-standalone
    volumes:
      - .:/workspace:cached
      - claudio-shared:/home/dev/.claudio-shared
      - claudio-test-sessions:/home/dev/.claudio-sessions
    labels:
      com.claudio.service: "devcontainer-test"

volumes:
  # Named bind mount — shared auth, config, plugins, caches
  claudio-shared:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${CLAUDIO_ROOT:-/home/kschepis/.claudio}/shared

  # Named bind mount — persistent Claudio devcontainer sessions
  claudio-sessions:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${CLAUDIO_ROOT:-/home/kschepis/.claudio}/sessions/claudio

  # Ephemeral sessions for standalone service
  claudio-standalone-sessions:

  # Ephemeral sessions for test service
  claudio-test-sessions:

networks:
  dev-network:
    driver: bridge
