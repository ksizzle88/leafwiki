# Claudio v2.1 - Docker Compose Configuration
#
# Two services:
# - claudio-standalone: Full standalone service (CI/CD, testing, non-VS Code use)
# - devcontainer: VS Code attaches here (extends standalone)

services:
  # Base service - standalone capable, all runtime config here
  claudio-standalone:
    build:
      context: .
      dockerfile: Dockerfile.base
      args:
        DEV_USER: ${DEV_USER:-dev}
        DEV_UID: ${DEV_UID:-1000}
        DEV_GID: ${DEV_GID:-1000}
        DEV_PASSWORD: ${DEV_PASSWORD:-dev}
        NODE_VERSION: 22
        ZSH_IN_DOCKER_VERSION: 1.2.0
        GIT_USER_EMAIL: ${GIT_USER_EMAIL:-}
        GIT_USER_NAME: ${GIT_USER_NAME:-}
        GIT_GPG_SIGN: ${GIT_GPG_SIGN:-false}
        GIT_SIGNING_KEY: ${GIT_SIGNING_KEY:-}
        BUILD_COMMIT: ${BUILD_COMMIT:-unknown}
        BUILD_DATE: ${BUILD_DATE:-unknown}
        BUILD_BRANCH: ${BUILD_BRANCH:-unknown}
        BUILD_TAG: ${BUILD_TAG:-dev}
        BUILD_HOSTNAME: ${BUILD_HOSTNAME:-unknown}
    image: ${COMPOSE_PROJECT_NAME:-claudio}-base:${TAG:-develop}
    hostname: claudio

    # Security capabilities for firewall
    cap_add:
      - NET_ADMIN
      - NET_RAW

    volumes:
      # Workspace bind mount
      - .:/workspace:cached
      # Shared volume (auth, plugins, caches)
      - claudio-shared:/home/dev/.claudio-shared
      # Standalone-specific volumes (not used when VS Code overrides)
      - claudio-standalone:/home/dev/.claudio
      - commandhistory-standalone:/commandhistory

    environment:
      # Claudio paths
      CLAUDE_CONFIG_DIR: /home/dev/.claude
      CLAUDIO_HOME: /home/dev/.claudio
      CLAUDIO_SHARED: /home/dev/.claudio-shared
      # Shell
      SHELL: /bin/zsh
      EDITOR: nano
      # Locale
      TZ: ${TZ:-UTC}
      LANG: C.UTF-8
      LC_ALL: C.UTF-8

    # Entrypoint from Dockerfile handles: permission fixes, init-claudio, sleep infinity

    # Healthcheck
    healthcheck:
      test: ["CMD", "sh", "-c", "which claude && which codex"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

    # Resource limits
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
        reservations:
          cpus: '1.0'
          memory: 2G

    # Labels
    labels:
      com.claudio.description: "Claude Code development container"
      com.claudio.service: "standalone"
      com.claudio.version: "2.1.0"
      com.claudio.project: "claudio"

    # Network
    networks:
      - dev-network

    # Restart policy
    restart: unless-stopped

  # VS Code devcontainer - extends standalone
  # devcontainer.json adds: per-container volumes, SSH/GPG mounts, features
  devcontainer:
    extends:
      service: claudio-standalone
    ports:
      - "5565:5565"
    volumes:
      - /home/kschepis/workspaces/mpulse:/workspace/mpulse:cached
    labels:
      com.claudio.service: "devcontainer"

  # Test service for developing the devcontainer itself
  # Usage:
  #   docker compose build devcontainer-test
  #   docker compose up -d devcontainer-test
  #   docker compose exec devcontainer-test zsh
  #   # Test your changes, then swap in devcontainer.json: "service": "devcontainer-test"
  devcontainer-test:
    extends:
      service: claudio-standalone
    volumes:
      - .:/workspace:cached
      - claudio-shared:/home/dev/.claudio-shared
      - claudio-test:/home/dev/.claudio
      - commandhistory-test:/commandhistory
    labels:
      com.claudio.service: "devcontainer-test"

volumes:
  # Shared volume for auth, plugins, caches (external - create with create-volumes.sh)
  claudio-shared:
    external: true
    name: claudio-shared

  # Standalone service volumes (used when running without VS Code)
  claudio-standalone:
  commandhistory-standalone:

  # Test service volumes (for developing the devcontainer)
  claudio-test:
  commandhistory-test:

  # Note: Per-container volumes are created via devcontainer.json:
  # - claudio-${devcontainerId} (per-container state)
  # - claudio-history-${devcontainerId} (per-container shell history)

networks:
  dev-network:
    driver: bridge
