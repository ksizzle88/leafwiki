[package]
name = "jtbl"
version = "0.1.0"
edition = "2021"
description = "JSON exploration and table tool with interactive TUI"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
jaq-core = "1"
jaq-interpret = "1"
jaq-parse = "1"
jaq-std = "1"
ratatui = "0.29"
crossterm = "0.28"
comfy-table = "7"
anyhow = "1"
unicode-width = "0.2"

[profile.release]
lto = true
strip = true
